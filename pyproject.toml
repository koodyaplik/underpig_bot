[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "underpig-flight-bot"
version = "0.1.0"
description = "Telegram flight tracking bot backed by FlightAware AeroAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.7,<3",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
voice = [
  "aiohttp-socks>=0.10,<1",
  "av>=14,<17",
  "ctranslate2>=4.6,<5",
  "faster-whisper>=1.2,<2",
  "onnxruntime>=1.20,<2",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
